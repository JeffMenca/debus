name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test --affected

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: debus
          POSTGRES_PASSWORD: debus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U debus" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
      PUBSUB_PROJECT_ID: debus-local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start Pub/Sub emulator
        run: |
          docker run -d -p 8085:8085 --add-host host.docker.internal:host-gateway \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=debus-local
          timeout 60 sh -c 'until curl -s localhost:8085 >/dev/null; do sleep 2; done'
      - name: Create service databases
        run: ./infra/postgres/init-databases.sh
        env:
          PGHOST: localhost
          PGPASSWORD: debus
          POSTGRES_USER: debus
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:integration --affected

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @debus/web exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --affected
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  affected:
    runs-on: ubuntu-latest
    outputs:
      deployables: ${{ steps.list.outputs.deployables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        run: echo "deployables=$(node scripts/affected-deployables.mjs)" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: [check, affected]
    if: needs.affected.outputs.deployables != '[]'
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.affected.outputs.deployables) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.unit == 'web' && 'web' || 'service' }}.Dockerfile
          build-args: SERVICE=${{ matrix.unit }}
          push: false
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.unit }}
