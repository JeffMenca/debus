name: deploy

# Every merge to main ships the affected units to production (the "production" environment requires approval).
# Requires the repository variables printed by infra/gcp/bootstrap.sh. Secrets live in Secret Manager as <service>-database-url.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every unit, not only the affected ones
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TURBO_SCM_BASE: ${{ github.event.before }}

jobs:
  plan:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.list.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        env:
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ]; then
            pnpm turbo run build --filter=@debus/contracts >/dev/null
            units=$(node -e "console.log(JSON.stringify(require('@debus/contracts').DEPLOY_UNITS))")
          else
            units=$(node scripts/affected-deployables.mjs)
          fi
          echo "releases=$(jq -c --arg tag "$GITHUB_SHA" 'map({unit: ., tag: $tag})' <<<"$units")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.releases) }}
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.unit == 'web' && 'web' || 'service' }}.Dockerfile
          build-args: SERVICE=${{ matrix.unit }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.unit }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.unit }}
      - name: Build and push migration image
        if: hashFiles(format('services/{0}/prisma/schema.prisma', matrix.unit)) != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          target: migrator
          build-args: SERVICE=${{ matrix.unit }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.unit }}-migrate:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.unit }}

  release:
    needs: [plan, build]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      environment: production
      releases: ${{ needs.plan.outputs.releases }}
