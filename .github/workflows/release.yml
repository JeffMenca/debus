name: release

# Deploys already-built images to production. Called by deploy.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      releases:
        description: 'JSON array of {"unit": "<name>", "tag": "<image tag>"}'
        type: string
        required: true
    secrets:
      SMTP_PASSWORD:
        required: false
      JWT_PRIVATE_KEY:
        required: false
      JWT_PUBLIC_KEY:
        required: false

jobs:
  # Topics and filtered push subscriptions must exist before any service starts: a message published to
  # a topic without a matching subscription is discarded. Push endpoints are deterministic Cloud Run URLs,
  # so subscriptions can be created before their service; Pub/Sub retries a push up to 5 times (about
  # 2.5 minutes) and then sends the message to the consumer's dead-letter subscription.
  # Required values are checked first so a missing secret aborts the release before it changes anything.
  pubsub:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@debus/messaging
      - name: Check required values of every unit
        run: |
          status=0
          while read -r unit; do
            node scripts/check-release-env.mjs "$unit" || status=1
          done < <(jq -r '.[].unit' <<<"$RELEASES")
          exit "$status"
        env:
          RELEASES: ${{ inputs.releases }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Provision topics, push subscriptions and dead-letters
        run: node scripts/provision-pubsub.mjs
        env:
          DEBUS_ENV: ${{ inputs.environment }}
          PUBSUB_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}

  deploy:
    needs: pubsub
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.releases) }}
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}
      UNIT: ${{ matrix.unit }}
      TAG: ${{ matrix.tag }}
      TARGET_ENV: ${{ inputs.environment }}
      MAX_INSTANCES: '1'
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@debus/contracts
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run migrations
        if: hashFiles(format('services/{0}/prisma/schema.prisma', matrix.unit)) != ''
        run: |
          gcloud run jobs deploy "$UNIT-migrate" \
            --image "$REGISTRY/$UNIT-migrate:$TAG" \
            --region "$GCP_REGION" \
            --service-account "debus-$UNIT@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${{ vars.GCP_CLOUDSQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=$UNIT-database-url:latest" \
            --execute-now --wait

      - name: Deploy to Cloud Run
        env:
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          flags=(--image "$REGISTRY/$UNIT:$TAG" --region "$GCP_REGION"
                 --service-account "debus-$UNIT@$GCP_PROJECT_ID.iam.gserviceaccount.com"
                 --min-instances 0 --max-instances "$MAX_INSTANCES"
                 --set-env-vars "$(node scripts/cloud-run-env.mjs "$UNIT" "$TARGET_ENV")")
          if [ -f "services/$UNIT/prisma/schema.prisma" ]; then
            flags+=(--set-cloudsql-instances "${{ vars.GCP_CLOUDSQL_INSTANCE }}" --set-secrets "DATABASE_URL=$UNIT-database-url:latest")
          fi
          if [ "$UNIT" = "gateway" ] || [ "$UNIT" = "web" ]; then flags+=(--allow-unauthenticated); else flags+=(--no-allow-unauthenticated); fi
          gcloud run deploy "$UNIT" "${flags[@]}"

      - name: Verify /health
        run: |
          url="https://$UNIT-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app"
          path=$([ "$UNIT" = "web" ] && echo /api/health || echo /health)
          auth=()
          if [ "$UNIT" != "gateway" ] && [ "$UNIT" != "web" ]; then
            token=$(gcloud auth print-identity-token --impersonate-service-account="${{ vars.GCP_DEPLOY_SA }}" --audiences="$url")
            auth=(-H "X-Serverless-Authorization: Bearer $token")
          fi
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${auth[@]}" "$url$path"

      - name: Schedule outbox flush
        if: hashFiles(format('services/{0}/prisma/schema.prisma', matrix.unit)) != ''
        run: |
          url="https://$UNIT-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app"
          job="$UNIT-outbox-flush"
          args=(--location "$GCP_REGION" --schedule "* * * * *" --uri "$url/outbox/flush" --http-method POST
                --oidc-service-account-email "pubsub-invoker@$GCP_PROJECT_ID.iam.gserviceaccount.com"
                --oidc-token-audience "$url")
          if gcloud scheduler jobs describe "$job" --location "$GCP_REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$job" "${args[@]}"
          else
            gcloud scheduler jobs create http "$job" "${args[@]}"
          fi
