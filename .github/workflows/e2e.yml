name: e2e

# Runs against production after every deploy. URLs are the deterministic Cloud Run ones.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

jobs:
  api:
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.GCP_PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Only the health checks: they need no session and write nothing, so they are safe in production.
      - name: Run the health checks of the Postman collection
        env:
          API_URL: https://gateway-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
        run: npx --yes newman@6.2.2 run postman/debus.postman_collection.json --folder "Salud" --env-var "baseUrl=$API_URL" --reporters cli

  web:
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.GCP_PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @debus/web exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --filter=@debus/web
        env:
          E2E_BASE_URL: https://web-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
          E2E_REAL_API: '1'
