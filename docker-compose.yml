# Local logs rotate so a noisy container never fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debus}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-debus}']
      interval: 5s
      timeout: 3s
      retries: 10

  pubsub:
    logging: *logging
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=${PUBSUB_PROJECT_ID:-debus-local}
    # gcloud also copies the emulator output to an unrotated file; every failed push writes a full stack trace.
    environment:
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: 'true'
    ports:
      - '8085:8085'
    # Push subscriptions reach the services running on the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  mailpit:
    logging: *logging
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  gcs:
    logging: *logging
    image: fsouza/fake-gcs-server:1.56.1
    command: -scheme http -port 4443 -external-url http://localhost:4443 -backend memory
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mkdir -p /data/debus-media-local && exec /bin/fake-gcs-server -data /data "$$@"',
        '--',
      ]
    ports:
      - '4443:4443'

volumes:
  postgres-data:
